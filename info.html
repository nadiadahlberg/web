<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INFO</title>

  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Förhindrar scrollning */
    }
  </style>

  <script>
    document.addEventListener("contextmenu", event => event.preventDefault());
    document.addEventListener("dragstart", event => event.preventDefault());
  </script>
</head>

<body style="
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background-image: url('assets/img/Infobakgrund.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
">

<!-- MENYBILD -->
<img
  src="assets/img/Infomeny5.png"
  usemap="#image-map"
  draggable="false"
  style="
    width: min(95vw, 168.97vh); /* bilden är 1800 x 1012, ska aldrig bli högre än fönstret */
    height: auto;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  "
>

<!-- IMAGE MAP -->
<map name="image-map">
 
  <area
        alt="Home"      
        href="https://gdbsthlm.com"
        coords="179,364,411,406"
        shape="rect">

  <area
        alt="Email"
        href="mailto:info@gdbsthlm.com"
        coords="553,582,1224,729"
        shape="rect">

</map>

<script src="assets/js/hotspots.js"></script>

</body>
</html>
