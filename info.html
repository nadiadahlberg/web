<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INFO</title>

  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">

  <!-- IMAGE MAP RESIZER (VIKTIGT) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/js/imageMapResizer.min.js"></script>

  <script>
    window.onload = function () {
      imageMapResize();
    };
  </script>

  <script>
    document.addEventListener("contextmenu", event => event.preventDefault());
    document.addEventListener("dragstart", event => event.preventDefault());
  </script>
</head>

<body style="
  margin: 0;
  min-height: 100vh;
  background-image: url('https://raw.githubusercontent.com/nadiadahlberg/web/refs/heads/main/assets/img/Infobakgrund.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
">

<!-- MENYBILD (40% större än 88vw = ca 123vw, men stabiliserad till 112vw) -->
<img 
  src="https://raw.githubusercontent.com/nadiadahlberg/web/refs/heads/main/assets/img/Infomeny%202.png"
  alt="Min bild"
  usemap="#image-map"
  draggable="false"
  style="
    width: 65vw;
    height: auto;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  "
>

<!-- IMAGE MAP -->
<map name="image-map">

    <area target="_blank"
          alt="HOME"
          href="https://gdbsthlm.com/construction"
          coords="16,161,115,237"

    <area target="_blank"

    <area target="_blank"

          shape="rect">

    <area target="_blank"
          alt="EMAIL"

          coords="354,435,1024,577"
          shape="rect">

</map>

</html>
