<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHOP</title>

  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">

  <style>
    .hero-image {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>

<body style="
  margin: 0;
  min-height: 100vh;
  background-image: url('https://raw.githubusercontent.com/nadiadahlberg/web/refs/heads/main/assets/img/WEBSHOP%20pattern.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
">

  <!-- HERO BILD -->
  <img 
    src="https://raw.githubusercontent.com/nadiadahlberg/web/refs/heads/main/assets/img/WEBSHOP%201366X768.png"
    class="hero-image"
    alt="Shop banner"
  />

  <script>
    document.addEventListener("contextmenu", event => event.preventDefault());
    document.addEventListener("dragstart", event => event.preventDefault());
  </script>

</body>
</html>
