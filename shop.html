<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHOP</title>

  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">

  <style>
    .hero-image {
      width: 100%;
      height: 40vh;
      object-fit: cover;
      display: block;
    }
  </style>
</head>

<body style="
  margin: 0;
  min-height: 100vh;
  background-image: url('https://raw.githubusercontent.com/nadiadahlberg/web/refs/heads/main/assets/img/WEBSHOP%20pattern.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;

  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
">

  <!-- HERO IMAGE (högst upp på sidan) -->
  <img
    src="https://raw.githubusercontent.com/nadiadahlberg/web/refs/heads/main/assets/img/WEBSHOP%201366X768.png"
    alt="Shop hero image"
    class="hero-image"
  >

  <!-- Placeholder content (gör sidan scrollbar just nu) -->
  <div style="height: 150vh;"></div>

  <script>
    document.addEventListener("contextmenu", event => event.preventDefault());
    document.addEventListener("dragstart", event => event.preventDefault());
  </script>

</body>
</html>
