<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNDER CONSTRUCTION</title>

  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Förhindrar scrollning */
    }
  </style>

  <!-- IMAGE MAP RESIZER -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/js/imageMapResizer.min.js"></script>

  <script>
    window.onload = function () {
      imageMapResize();
    };
  </script>

  <script>
    document.addEventListener("contextmenu", event => event.preventDefault());
    document.addEventListener("dragstart", event => event.preventDefault());
  </script>
</head>

<body style="
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background-image: url('https://raw.githubusercontent.com/nadiadahlberg/web/refs/heads/main/assets/img/Infobakgrund.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
">

<!-- MENYBILD -->
<img
  src="https://raw.githubusercontent.com/nadiadahlberg/web/refs/heads/main/assets/img/Infomeny5.png"
  alt="Min bild"
  usemap="#image-map"
  draggable="false"
  style="
    width: 95vw;
    height: auto;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  "
>

</body>
</html>
