<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GDB</title>

  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">

  <script>
    document.documentElement.style.overflow = "hidden";
    document.body.style.overflow = "hidden";

    document.addEventListener("wheel", e => e.preventDefault(), { passive: false });
    document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
  </script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;

      background-image: url("https://raw.githubusercontent.com/nadiadahlberg/web/refs/heads/main/assets/img/d133f034-3f9a-413a-9160-69c4f4279c2f.png");
      background-repeat: repeat;
      background-position: top left;
      background-size: auto;
    }

    #startbild {
      width: min(88vw, 1100px);
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      display: block;
    }
  </style>
</head>

<body>

<img
  id="startbild"
  src="https://raw.githubusercontent.com/nadiadahlberg/web/refs/heads/main/assets/img/Startmeny%203.png"
  alt="Startmeny"
  usemap="#image-map"
  draggable="false"
>

<map name="image-map">
  <area alt="INFO" href="https://gdbsthlm.com/info" coords="96,150,249,214" shape="rect">
  <area alt="SHOP" href="https://gdbsthlm.com/shop" coords="43,414,206,507" shape="rect">
  <area alt="AUDIO" href="https://gdbsthlm.com/audio" coords="372,333,491,363" shape="rect">
  <area alt="VIDEO" href="https://gdbsthlm.com/video" coords="569,327,684,357" shape="rect">
  <area alt="PICTURES" href="https://gdbsthlm.com/pictures" coords="763,345,937,378" shape="rect">
  <area alt="CONTACT" href="mailto:info@gdbsthlm.com" coords="541,607,980,647" shape="rect">
</map>

<script>
  document.addEventListener("contextmenu", event => event.preventDefault());
  document.addEventListener("dragstart", event => event.preventDefault());
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/js/imageMapResizer.min.js"></script>

<script>
  window.addEventListener("load", function () {
    imageMapResize();
  });
</script>

</body>
</html>
