<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GDB</title>

  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">

  <script>
    document.documentElement.style.overflow = "hidden";

    document.addEventListener("wheel", e => e.preventDefault(), {
      passive: false
    });

    document.addEventListener("touchmove", e => e.preventDefault(), {
      passive: false
    });
  </script>

</head>


<body class="start-page">


<img
  class="center-image"
  src="https://raw.githubusercontent.com/nadiadahlberg/web/refs/heads/main/assets/img/Meny%20(f%C3%B6r%20Index).png"
  usemap="#image-map"
  draggable="false"
>


<map name="image-map">

  <area
    alt="SHOP"
    href="https://gdbsthlm.com/shop"
    coords="97,578,282,470"
    shape="rect">

  <area
    alt="INFO"
    href="https://gdbsthlm.com/info"
    coords="326,233,223,165"
    shape="rect">

  <area
    alt="AUDIO"
    href="https://gdbsthlm.com/audio"
    coords="473,376,611,407"
    shape="rect">

  <area
    alt="VIDEO"
    href="https://gdbsthlm.com/video"
    coords="702,368,832,400"
    shape="rect">

  <area
    alt="PICTURES"
    href="https://gdbsthlm.com/pictures"
    coords="927,390,1126,421"
    shape="rect">

  <area
    alt="CONTACT"
    href="mailto:info@gdbsthlm.com"
    coords="672,692,1167,726"
    shape="rect">

  <area
    alt="CONSTRUCTION"
    href="https://gdbsthlm.com/construction"
    coords="1351,253,62"
    shape="circle">

</map>


<script>

document.addEventListener("contextmenu", event => event.preventDefault());

document.addEventListener("dragstart", event => event.preventDefault());

</script>


<!-- IMAGE MAP RESIZER -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/js/imageMapResize.min.js"></script>

<script>

window.addEventListener("load", function () {

  imageMapResize();

});

</script>


</body>
</html>
