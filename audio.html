<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AUDIO</title>


<link rel="preload"
      href="assets/img/Muspekare%202.png"
      as="image">


<link rel="stylesheet" href="assets/css/styles.css">


<link rel="icon" type="image/png" href="assets/img/favicon.png">


<style>

html,
body {

  margin:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background-color:#ffffff;

}


.audio-page {

  display:flex;

  justify-content:center;

  align-items:center;

}



.audio-image {

  width:80vw;

  height:auto;

  display:block;

  user-select:none;

  -webkit-user-drag:none;

}


</style>


</head>


<body class="audio-page">


<img

class="audio-image"

src="https://raw.githubusercontent.com/nadiadahlberg/web/refs/heads/main/assets/img/AUDIO.png"

alt="AUDIO"

draggable="false"

usemap="#image-map"

>



<map name="image-map">


<area

alt="Spotify"

href="https://open.spotify.com/artist/0AlxN7pmgboll3smvAphdV"

coords="332,441,484,490"

shape="rect">



<area

alt="Bandcamp"

href="https://djcrime.bandcamp.com/"

coords="842,449,1050,500"

shape="rect">



<area

alt="Home"

href="https://gdbsthlm.com"

coords="574,694,789,735"

shape="rect">

</map>



<script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/js/imageMapResizer.min.js"></script>


<script>

window.addEventListener("load", function(){

  imageMapResize();

});


document.addEventListener(
"contextmenu",
event => event.preventDefault()
);


document.addEventListener(
"dragstart",
event => event.preventDefault()
);


</script>


</body>

</html>
