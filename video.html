<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIDEO</title>

<link rel="stylesheet" href="assets/css/styles.css">

<link rel="icon" type="image/png" href="assets/img/favicon.png">

</head>


<body class="video-page">


<!-- =================================
     VIDEO TOP IMAGE
     ================================= -->

<div class="video-header">

  <img
    src="assets/img/VIDEOMENY.png"
    alt="Video"
    draggable="false"
    usemap="#image-map"
  >

</div>


<!-- =================================
     IMAGE MAP
     ================================= -->

<map name="image-map">

  <area
    alt="Home"
    href="https://gdbsthlm.com"
    coords="19,221,313,277"
    shape="rect"
  >

</map>


<!-- =================================
     VIDEOS
     ================================= -->

<section class="videos">


  <div class="video">

    <iframe
      loading="lazy"
      src="https://www.youtube.com/embed/3bENWaTxYkY"
      title="YouTube video"
      allowfullscreen>
    </iframe>

  </div>


  <div class="video">

    <iframe
      loading="lazy"
      src="https://www.youtube.com/embed/EdzJNp7YBWo"
      title="YouTube video"
      allowfullscreen>
    </iframe>

  </div>


  <div class="video">

    <iframe
      loading="lazy"
      src="https://www.youtube.com/embed/b4fx6BjWEqk"
      title="YouTube video"
      allowfullscreen>
    </iframe>

  </div>


</section>


<!-- =================================
     IMAGE MAP RESIZER
     ================================= -->

<script>


document.addEventListener("contextmenu", event => {

  event.preventDefault();

});


document.addEventListener("dragstart", event => {

  event.preventDefault();

});

</script>


<script src="assets/js/hotspots.js"></script>

</body>
</html>
