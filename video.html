<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIDEO</title>

<link rel="stylesheet" href="assets/css/styles.css">

<link rel="icon" type="image/png" href="assets/img/favicon.png">

</head>



<body class="video-page">



<!-- TOP IMAGE -->

<div class="video-header">

<img

src="https://raw.githubusercontent.com/nadiadahlberg/web/refs/heads/main/assets/img/VIDEOMENY.png"

alt="VIDEO"

draggable="false"

usemap="#image-map"

>

</div>





<!-- IMAGE MAP -->


<map name="image-map">


<area

alt="Construction"

title="Construction"

href="https://gdbsthlm.com/construction"

coords="175,197,107"

shape="circle">


</map>







<!-- VIDEOS -->


<section class="videos">



<div class="video">

<iframe

src="https://www.youtube.com/watch?v=EdzJNp7YBWo&list=LL"

title="YouTube video"

allowfullscreen>

</iframe>

</div>




<div class="video">

<iframe

src="https://www.youtube.com/embed/YOUTUBE_ID_2"

title="YouTube video"

allowfullscreen>

</iframe>

</div>




<div class="video">

<iframe

src="https://www.youtube.com/embed/YOUTUBE_ID_3"

title="YouTube video"

allowfullscreen>

</iframe>

</div>




</section>








<!-- IMAGE MAP RESIZER -->


<script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/js/imageMapResize.min.js"></script>


<script>


window.addEventListener("load", function(){

imageMapResize();

});



document.addEventListener("contextmenu", event => event.preventDefault());

document.addEventListener("dragstart", event => event.preventDefault());


</script>



</body>

</html>
