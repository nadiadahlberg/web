<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIDEO</title>

  <link rel="preload"
        href="assets/img/Muspekare%202.png"
        as="image">

  <link rel="stylesheet" href="assets/css/styles.css">

  <link rel="icon" type="image/png" href="assets/img/favicon.png">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      background-image: url("https://raw.githubusercontent.com/nadiadahlberg/web/refs/heads/main/assets/img/VIDEBG.jpg?v=2");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    img {
      user-select: none;
      display: block;
    }
  </style>
</head>

<body>

<img
  src="https://raw.githubusercontent.com/nadiadahlberg/web/refs/heads/main/assets/img/VIDEOMENY.png"
  alt="VIDEO"
  draggable="false"
  usemap="#image-map"
  style="
    width: 80vw;
    height: auto;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  "
>

<map name="image-map">
  <area target=""
        alt="Construction"
        href="https://gdbsthlm.com/construction"
        coords="175,197,107"
        shape="circle">
</map>

<!-- IMAGE MAP RESIZER -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/js/imageMapResizer.min.js"></script>
<script>
  window.addEventListener("load", function () {
    imageMapResize();
  });
</script>

</body>
</html>
